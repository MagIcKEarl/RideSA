<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
<title>Car Pool — Community E-Hailing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0e14;color:#e0e8f0;font-size:16px;line-height:1.5;padding-bottom:80px}
input,select{font-size:16px;width:100%;padding:14px 16px;background:#111820;border:1px solid #1e2a36;border-radius:10px;color:#fff;margin-bottom:12px}
input:focus{outline:none;border-color:#5fd0ff}
.screen{display:none;padding:20px;max-width:560px;margin:0 auto;min-height:100vh}
.screen.active{display:flex;flex-direction:column}
h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
h1 span{color:#5fd0ff}
.sub{color:#90a0b0;font-size:14px;margin-bottom:20px}
.btn{width:100%;padding:16px;background:#5fd0ff;color:#0a0e14;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
.btn:hover{background:#7fdfff}
.btn.small{padding:8px 14px;font-size:13px;display:inline-block;width:auto}
.btn.green{background:#1a3a2a;color:#4ade80}
.btn.green:hover{background:#2a4a3a}
.btn.orange{background:#3a3a1a;color:#fbbf24}
.btn.orange:hover{background:#4a4a2a}
.btn.red{background:#3a1a1a;color:#f87171}
.btn.red:hover{background:#4a2a2a}
.btn.outline{background:transparent;border:1px solid #1e2a36;color:#b0c0d0}
.link{color:#5fd0ff;text-align:center;margin-top:16px;font-size:14px;cursor:pointer}
.error{color:#f87171;font-size:13px;margin-bottom:8px}
.card{background:#111820;border:1px solid #1e2a36;border-radius:12px;padding:16px;margin-bottom:12px}
.card .title{font-weight:600;color:#fff;margin-bottom:4px}
.card .meta{color:#90a0b0;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge.scheduled{background:#1a2a3a;color:#5fd0ff}
.badge.departed{background:#3a3a1a;color:#fbbf24}
.badge.completed{background:#1a3a2a;color:#4ade80}
.badge.cancelled{background:#3a1a1a;color:#f87171}
.badge.panicked{background:#3a0000;color:#ff4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:0.5}}
.badge.paid{background:#1a3a2a;color:#4ade80}
.badge.boarded{background:#1a2a3a;color:#5fd0ff}
.badge.missed{background:#3a1a1a;color:#f87171}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#90a0b0;white-space:nowrap}
.tab.active{background:#1e2a36;color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
.empty{color:#607080;text-align:center;padding:30px 0;font-size:14px}
.rider-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
#map-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#0a0e14;display:none;flex-direction:column}
#map-overlay.active{display:flex}
#map-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111820;border-bottom:1px solid #1e2a36}
#map-header h2{font-size:18px}
#map-container{flex:1;min-height:0}
#map-footer{background:#111820;border-top:1px solid #1e2a36;padding:12px 16px;text-align:center;font-size:14px;color:#90a0b0}
.map-pin-btn{background:none;border:2px solid #5fd0ff;border-radius:8px;color:#5fd0ff;padding:4px 10px;font-size:12px;cursor:pointer;margin-left:4px}

.autocomplete-wrap{position:relative}
.suggestions{position:absolute;top:100%;left:0;right:0;background:#111820;border:1px solid #1e2a36;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;z-index:100;display:none}
.suggestions div{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid #1e2a36}
.suggestions div:hover{background:#1e2a36;color:#fff}
</style>
</head>
<body>

<!-- Login -->
<div class="screen active" id="screen-login">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    <h1 style="font-size:32px;text-align:center;margin-bottom:4px"><span>Car</span> Pool</h1>
    <p style="text-align:center;color:#90a0b0;margin-bottom:4px;font-size:14px">Community E-Hailing</p>
    <p style="text-align:center;color:#607080;margin-bottom:28px;font-size:12px">Pre-plan. Pre-pay. Share the ride.</p>
    <input id="login-id" placeholder="Phone number or email">
    <input id="login-pass" placeholder="Password" type="password">
    <div class="error" id="login-error"></div>
    <button class="btn" onclick="login()">Get Started</button>
    <div class="link" onclick="showRegister()" style="margin-top:4px">New here? Sign up for Car Pool</div>
    <div class="link" onclick="showForgot()">Forgot password?</div>
    <div id="register-form" style="display:none;width:100%;margin-top:12px">
      <input id="reg-name" placeholder="Your name">
      <input id="reg-id" placeholder="Phone number or email">
      <input id="reg-pass" placeholder="Password" type="password">
      <select id="reg-role" style="margin-bottom:12px">
        <option value="rider">Rider — book seats</option>
        <option value="driver">Driver — schedule trips</option>
      </select>
      <button class="btn" onclick="register()">Create Account</button>
      <div class="error" id="reg-error"></div>
      <div class="link" onclick="hideRegister()">← Already have an account? Sign in</div>
    </div>
    <div id="forgot-form" style="display:none;width:100%;margin-top:12px">
      <input id="forgot-id" placeholder="Phone or email">
      <input id="forgot-pass" type="password" placeholder="New password">
      <button class="btn" onclick="forgotPassword()">Reset Password</button>
      <div class="error" id="forgot-error"></div>
      <div class="link" onclick="hideForgot()">← Back to login</div>
    </div>
  </div>
</div>

<!-- Home -->
<div class="screen" id="screen-home">
  <div class="top-bar">
    <h1><span>Car</span> Pool</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="home-name" style="font-size:14px;color:#90a0b0"></span>
      <div class="link" onclick="logout()" style="margin:0;font-size:13px">Logout</div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="results"></div>
  <div id="tab-browse" class="tab-content active"><div id="trips-list"></div></div>
  <div id="tab-bookings" class="tab-content"><div id="bookings-list"></div></div>
  <div id="tab-mytrips" class="tab-content"><div id="mytrips-list"></div></div>
  <div id="tab-schedule" class="tab-content">
    <div id="s-map" style="height:250px;border-radius:10px;margin-bottom:12px;background:#111820"></div>
    <div class="link" style="margin:0 0 8px 0;font-size:12px;text-align:left" onclick="sGetLocation()">📍 Use my location</div>
    <input id="s-pickup" placeholder="Pickup location" oninput="autocomplete(this,'sp')" autocomplete="off">
    <div class="suggestions" id="sp"></div>
    <input id="s-dropoff" placeholder="Dropoff location" oninput="autocomplete(this,'sd')" autocomplete="off">
    <div class="suggestions" id="sd"></div>
    <input id="s-departure" type="datetime-local" placeholder="Departure time">
    <input id="s-price" placeholder="Price per seat (R)" type="number">
    <input id="s-seats" placeholder="Max seats" type="number">
    <div class="error" id="schedule-error"></div>
    <button class="btn" onclick="scheduleTrip()">Schedule Trip</button>
  </div>
</div>

<!-- Map overlay (removed — now embedded in schedule tab) -->

<script>

let acTimer = {};
function autocomplete(inp, suggestId) {
  const wrap = inp.parentElement;
  wrap.style.position = 'relative';
  let div = document.getElementById(suggestId);
  if (!div) {
    div = document.createElement('div'); div.id = suggestId;
    div.className = 'suggestions'; wrap.appendChild(div);
  }
  clearTimeout(acTimer[suggestId]);
  acTimer[suggestId] = setTimeout(async () => {
    const q = inp.value.trim();
    if (q.length < 3) { div.style.display = 'none'; return; }
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=5&countrycodes=za');
      const d = await r.json();
      div.innerHTML = d.map(p => '<div onclick="pickSuggestion(\''+suggestId+'\',\''+p.display_name.replace(/'/g,"\\'")+'\')">'+p.display_name.split(',')[0]+'<br><small style=\"color:#607080\">'+p.display_name.split(',').slice(1).join(',').trim()+'</small></div>').join('');
      div.style.display = d.length ? 'block' : 'none';
    } catch(e) { div.style.display = 'none'; }
  }, 300);
}
function pickSuggestion(suggestId, val) {
  const div = document.getElementById(suggestId);
  if (div) div.style.display = 'none';
  const inp = div ? div.parentElement.querySelector('input') : null;
  if (inp) inp.value = val.split(',')[0].trim();
}

const API = window.location.origin + '/api';
let token = null, user = null;
function normPhone(v) { return v.includes('@') ? '' : v.replace(/^0/, '+27'); }

async function login() {
  const login = document.getElementById('login-id').value;
  const password = document.getElementById('login-pass').value;
  document.getElementById('login-error').textContent = '';
  if (!login) return document.getElementById('login-error').textContent = 'Enter phone or email';
  try {
    let r = await fetch(API+'/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({login,password})});
    const d = await r.json();
    if (d.error) return document.getElementById('login-error').textContent = d.error;
    token = d.token; user = d.user;
    afterLogin();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Server offline: '+e.message;
  }
}

function showRegister() {
  document.querySelector('#screen-login h1').style.display = 'none';
  document.querySelectorAll('#screen-login p').forEach(e => e.style.display = 'none');
  document.getElementById('login-id').style.display = 'none';
  document.getElementById('login-pass').style.display = 'none';
  document.querySelector('#screen-login .btn').style.display = 'none';
  document.querySelectorAll('#screen-login .link').forEach(e => e.style.display = 'none');
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
  document.getElementById('register-form').querySelector('.link').style.display = '';
}
function hideRegister() {
  document.querySelector('#screen-login h1').style.display = '';
  document.querySelectorAll('#screen-login p').forEach(e => e.style.display = '');
  document.getElementById('login-id').style.display = '';
  document.getElementById('login-pass').style.display = '';
  document.querySelector('#screen-login .btn').style.display = '';
  document.querySelectorAll('#screen-login .link').forEach(e => e.style.display = '');
  document.getElementById('login-error').style.display = '';
  document.getElementById('register-form').style.display = 'none';
}
async function register() {
  const name = document.getElementById('reg-name').value;
  const login = document.getElementById('reg-id').value;
  const password = document.getElementById('reg-pass').value;
  const role = document.getElementById('reg-role').value;
  document.getElementById('reg-error').textContent = '';
  if (!name || !login || !password) return document.getElementById('reg-error').textContent = 'Fill in all fields';
  try {
    const r = await fetch(API+'/auth/register', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, phone: normPhone(login), email: login.includes('@')?login:'', password, role})});
    const d = await r.json();
    if (d.error) return document.getElementById('reg-error').textContent = d.error;
    token = d.token; user = d.user;
    afterLogin();
  } catch(e) {
    document.getElementById('reg-error').textContent = 'Failed: '+e.message;
  }
}
function afterLogin() {
  document.getElementById('home-name').textContent = 'Hi, '+user.name;
  document.getElementById('results').textContent = '';
  document.getElementById('tabs').innerHTML = `
    <div class="tab active" data-tab="browse" onclick="switchTab('browse')">Browse Trips</div>
    <div class="tab" data-tab="bookings" onclick="switchTab('bookings')">My Bookings</div>
    <div class="tab" data-tab="mytrips" onclick="switchTab('mytrips')">My Trips</div>
    <div class="tab" data-tab="schedule" onclick="switchTab('schedule')">+ Schedule</div>
  `;
  showScreen('home');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  if (id === 'home') { switchTab('browse'); }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="'+name+'"]').classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
  document.getElementById('tab-'+name).style.display = 'block';
  if (name === 'browse') loadTrips();
  if (name === 'bookings') loadMyBookings();
  if (name === 'mytrips') loadMyTrips();
  if (name === 'schedule') setTimeout(initSMap, 200);
}

async function api(path) { const r = await fetch(API+path, {headers:{'Authorization':'Bearer '+token}}); return r.json(); }

// --- Embedded map (schedule tab) ---
let sMap = null, sPickupMarker = null, sDropoffMarker = null, sPickupCoords = null, sDropoffCoords = null, sDrivers = [], sDriverTimer = null;

function initSMap() {
  const c = document.getElementById('s-map');
  if (!c) return;
  if (!sMap) {
    sMap = L.map(c).setView([-26.2, 28.0], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'OSM'}).addTo(sMap);
    sMap.on('click', e => {
      if (!sPickupCoords) setSPickup(e.latlng);
      else if (!sDropoffCoords) setSDropoff(e.latlng);
      else { setSPickup(e.latlng); setSDropoff(null); }
    });
  }
  setTimeout(() => sMap.invalidateSize(), 300);
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => {
      if (!sPickupCoords) setSPickup(p.coords);
    }, () => {}, {enableHighAccuracy:true,timeout:5000});
  }
  loadSDrivers();
  if (sDriverTimer) clearInterval(sDriverTimer);
  sDriverTimer = setInterval(loadSDrivers, 15000);
}
function setSPickup(latlng) {
  const lat = latlng.lat || latlng.latitude, lng = latlng.lng || latlng.longitude;
  sPickupCoords = [lat, lng];
  if (sPickupMarker) sPickupMarker.setLatLng([lat,lng]);
  else sPickupMarker = L.marker([lat,lng], {icon: L.divIcon({className:'',html:'<div style="background:#5fd0ff;width:14px;height:14px;border-radius:50%;border:3px solid #fff"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(sMap).bindPopup('Pickup');
  if (sMap.getZoom() < 14) sMap.setView([lat,lng], 14);
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&addressdetails=1')
    .then(r => r.json()).then(d => {
      document.getElementById('s-pickup').value = (d.display_name||lat+', '+lng).split(',')[0].trim();
    }).catch(() => {});
}
function setSDropoff(latlng) {
  if (!latlng) { sDropoffCoords = null; if (sDropoffMarker) { sMap.removeLayer(sDropoffMarker); sDropoffMarker = null; } document.getElementById('s-dropoff').value = ''; return; }
  const lat = latlng.lat||latlng.latitude, lng = latlng.lng||latlng.longitude;
  sDropoffCoords = [lat, lng];
  if (sDropoffMarker) sDropoffMarker.setLatLng([lat,lng]);
  else sDropoffMarker = L.marker([lat,lng], {icon: L.divIcon({className:'',html:'<div style="background:#f87171;width:14px;height:14px;border-radius:50%;border:3px solid #fff"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(sMap).bindPopup('Dropoff');
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&addressdetails=1')
    .then(r => r.json()).then(d => {
      document.getElementById('s-dropoff').value = (d.display_name||lat+', '+lng).split(',')[0].trim();
    }).catch(() => {});
}
function sGetLocation() {
  if (!navigator.geolocation) return alert('GPS not available');
  navigator.geolocation.getCurrentPosition(p => setSPickup(p.coords), () => alert('Could not get location'), {enableHighAccuracy:true,timeout:10000});
}
async function loadSDrivers() {
  if (!token || !sMap) return;
  try {
    const drivers = await api('/location/drivers');
    sDrivers.forEach(m => sMap.removeLayer(m));
    sDrivers = [];
    drivers.forEach(d => {
      const m = L.marker([d.lat, d.lng], {icon: L.divIcon({className:'',html:'<div style="background:#4ade80;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(74,222,128,.5)"></div>',iconSize:[12,12],iconAnchor:[6,6]})}).addTo(sMap).bindPopup('🚗 <b>'+d.name+'</b>');
      sDrivers.push(m);
    });
  } catch(e) {}
}

async function loadTrips() {
  const trips = await api('/carpool/trips');
  document.getElementById('trips-list').innerHTML = trips.length
    ? trips.map(t => `<div class="card">
        <div class="title">${t.pickup} → ${t.dropoff}</div>
        <div class="meta">🚗 ${t.driverName} · 📅 ${new Date(t.departure).toLocaleString('en-ZA')}</div>
        <div class="meta" style="margin-top:4px">R${t.price}/seat · ${t.booked}/${t.max_seats} seats filled · <span class="badge ${t.status}">${t.status}</span></div>
        ${t.status==='scheduled' && t.booked < t.max_seats ? `<button class="btn small green" onclick="bookTrip('${t.id}')">Book Seat - R${t.price}</button>` : ''}
      </div>`).join('')
    : '<div class="empty">No upcoming trips. Be the first to schedule one!</div>';
}

async function bookTrip(id) {
  try {
    const r = await fetch(API+'/carpool/trips/'+id+'/book', {method:'POST', headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    if (d.error) return alert(d.error);
    alert('Seat booked! Pay the driver on boarding.');
    loadTrips();
  } catch(e) { alert('Failed: '+e.message); }
}

async function loadMyBookings() {
  const rides = await api('/carpool/my-bookings');
  document.getElementById('bookings-list').innerHTML = rides.length
    ? rides.map(r => `<div class="card">
        <div class="title">${r.pickup} → ${r.dropoff}</div>
        <div class="meta">🚗 ${r.driverName} · ${new Date(r.departure).toLocaleString('en-ZA')}</div>
        <div class="meta" style="margin-top:4px">R${r.price} · <span class="badge ${r.status}">${r.status}</span></div>
        ${r.status==='paid'||r.status==='boarded' ? `<button class="btn small" style="background:#3a1a1a;color:#f87171;border:2px solid #f87171;margin-top:8px" onclick="panicTrip('${r.tripId}')">🚨 Panic</button>` : ''}
      </div>`).join('')
    : '<div class="empty">No bookings yet. Browse trips and book a seat!</div>';
}

async function loadMyTrips() {
  const trips = await api('/carpool/trips?mine=1');
  document.getElementById('mytrips-list').innerHTML = trips.length
    ? await Promise.all(trips.map(async t => {
        const td = await api('/carpool/trips/'+t.id);
        return `<div class="card">
          <div class="title">${t.pickup} → ${t.dropoff}</div>
          <div class="meta">📅 ${new Date(t.departure).toLocaleString('en-ZA')} · <span class="badge ${t.status}">${t.status}</span></div>
          <div class="meta">R${t.price}/seat · ${td.booked}/${t.max_seats} booked</div>
          ${td.bookings && td.bookings.length ? `<div style="margin-top:8px;border-top:1px solid #1e2a36;padding-top:8px">${td.bookings.map(b => `<div class="rider-item"><span>${b.riderName}</span><span class="badge ${b.status}">${b.status} ${b.status==='paid'?'<button class="btn small green" onclick="boardRider(\''+b.id+'\')">Board</button>':''}</span></div>`).join('')}</div>` : ''}
          <div style="display:flex;gap:8px;margin-top:8px">
            ${t.status==='scheduled' ? `<button class="btn orange small" onclick="departTrip('${t.id}')">Depart Now</button>` : ''}
            ${t.status==='scheduled'||t.status==='departed' ? `<button class="btn small" style="background:#3a1a1a;color:#f87171;border:2px solid #f87171" onclick="panicTrip('${t.id}')">🚨 Panic</button>` : ''}
          </div>
        </div>`;
      })).then(r => r.join(''))
    : '<div class="empty">No trips scheduled. Schedule your first trip!</div>';
}

async function scheduleTrip() {
  const pickup = document.getElementById('s-pickup').value;
  const dropoff = document.getElementById('s-dropoff').value;
  const departure = document.getElementById('s-departure').value;
  const price = parseFloat(document.getElementById('s-price').value);
  const max_seats = parseInt(document.getElementById('s-seats').value);
  document.getElementById('schedule-error').textContent = '';
  if (!pickup || !dropoff || !departure || !price || !max_seats)
    return document.getElementById('schedule-error').textContent = 'Fill in all fields';
  try {
    const r = await fetch(API+'/carpool/trips', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify({pickup,dropoff,departure:new Date(departure).toISOString(),price,max_seats})});
    const d = await r.json();
    if (d.error) return document.getElementById('schedule-error').textContent = d.error;
    document.getElementById('s-pickup').value='';document.getElementById('s-dropoff').value='';
    document.getElementById('s-departure').value='';document.getElementById('s-price').value='';
    document.getElementById('s-seats').value='';
    switchTab('mytrips');
  } catch(e) { document.getElementById('schedule-error').textContent = 'Failed: '+e.message; }
}

async function boardRider(id) {
  try {
    const r = await fetch(API+'/carpool/bookings/'+id+'/board', {method:'PUT', headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    if (d.error) return alert(d.error);
    loadMyTrips();
  } catch(e) { alert('Failed: '+e.message); }
}

async function departTrip(id) {
  if (!confirm('Depart now? Unboarded riders will be marked as missed and forfeit their fare.')) return;
  try {
    const r = await fetch(API+'/carpool/trips/'+id+'/depart', {method:'PUT', headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    if (d.error) return alert(d.error);
    loadMyTrips();
  } catch(e) { alert('Failed: '+e.message); }
}

async function panicTrip(id) {
  if (!confirm('🚨 Trigger emergency alert for this trip? Your location will be shared with admin.')) return;
  try {
    const r = await fetch(API+'/carpool/trips/'+id+'/panic', {method:'PUT', headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    if (d.error) return alert(d.error);
    alert('🚨 Emergency reported. Admin has been notified.');
    loadMyTrips();
    loadMyBookings();
  } catch(e) { alert('Failed: '+e.message); }
}

function showForgot() {
  const c = document.getElementById('screen-login').querySelector('div');
  c.querySelectorAll('h1,p,input,.btn,.link:not([onclick*=Forgot])').forEach(e => e.style.display = 'none');
  document.getElementById('forgot-form').style.display = 'block';
}
function hideForgot() {
  const c = document.getElementById('screen-login').querySelector('div');
  c.querySelectorAll('h1,p,input,.btn,.link').forEach(e => e.style.display = '');
  document.getElementById('forgot-form').style.display = 'none';
}
async function forgotPassword() {
  const login = document.getElementById('forgot-id').value;
  const password = document.getElementById('forgot-pass').value;
  document.getElementById('forgot-error').textContent = '';
  if (!login || !password) return document.getElementById('forgot-error').textContent = 'Fill in both fields';
  try {
    const r = await fetch(API+'/auth/forgot', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({login,password})});
    const d = await r.json();
    if (d.error) return document.getElementById('forgot-error').textContent = d.error;
    alert('Password reset! Sign in with your new password.');
    hideForgot();
  } catch(e) { document.getElementById('forgot-error').textContent = 'Failed: '+e.message; }
}

function logout() {
  token = null; user = null;
  showScreen('login');
}
</script>
