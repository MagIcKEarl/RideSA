<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
<title>RideSA — Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0e14;color:#e0e8f0;font-size:14px;line-height:1.5}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:#111820;border-right:1px solid #1e2a36;padding:20px 16px}
.sidebar h2{color:#fff;font-size:18px;margin-bottom:24px}
.sidebar h2 span{color:#5fd0ff}
.sidebar a{display:block;padding:10px 12px;color:#b0c0d0;text-decoration:none;border-radius:6px;margin-bottom:4px;cursor:pointer}
.sidebar a:hover,.sidebar a.active{background:#1e2a36;color:#5fd0ff}
.main{margin-left:200px;padding:24px 32px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #1e2a36}
.topbar h1{color:#fff;font-size:22px}
.topbar .user{color:#90a0b0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:#111820;border:1px solid #1e2a36;border-radius:10px;padding:20px}
.stat-card .label{font-size:11px;text-transform:uppercase;color:#7090a0;letter-spacing:1px}
.stat-card .value{font-size:28px;font-weight:700;color:#fff;margin-top:4px}
.stat-card .value.green{color:#4ade80}
.stat-card .value.blue{color:#5fd0ff}
.stat-card .value.orange{color:#fbbf24}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{text-align:left;font-size:11px;text-transform:uppercase;color:#7090a0;padding:10px 8px;border-bottom:1px solid #1e2a36}
td{padding:10px 8px;border-bottom:1px solid #1a2430;color:#c0d0e0}
tr:hover{background:#111820}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.status.requested{background:#1a3a5a;color:#5fd0ff}
.status.accepted{background:#3a3a1a;color:#fbbf24}
.status.completed{background:#1a3a2a;color:#4ade80}
.status.cancelled{background:#3a1a1a;color:#f87171}
.section{display:none}
.section.active{display:block}
.btn{display:inline-block;padding:8px 16px;background:#5fd0ff;color:#0a0e14;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:#7fdfff}
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
#login-screen h1{color:#fff;font-size:28px}
#login-screen h1 span{color:#5fd0ff}
#login-screen input{padding:12px 16px;background:#111820;border:1px solid #1e2a36;border-radius:8px;color:#fff;font-size:15px;width:300px}
#login-screen input:focus{outline:none;border-color:#5fd0ff}
#login-screen .error{color:#f87171;font-size:13px}

.autocomplete-wrap{position:relative}
.suggestions{position:absolute;top:100%;left:0;right:0;background:#111820;border:1px solid #1e2a36;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;z-index:100;display:none}
.suggestions div{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid #1e2a36}
.suggestions div:hover{background:#1e2a36;color:#fff}
</style>
</head>
<body>
<div id="login-screen">
  <h1><span>Ride</span>SA</h1>
  <p style="color:#90a0b0">Admin Dashboard</p>
  <input id="admin-id" placeholder="Phone or email">
  <input id="admin-pass" type="password" placeholder="Password">
  <div class="error" id="login-error"></div>
  <button class="btn" onclick="login()">Login</button>
  <div class="link" onclick="showForgot()">Forgot password?</div>
  <div id="forgot-form" style="display:none;width:300px">
    <input id="forgot-id" placeholder="Phone or email">
    <input id="forgot-pass" type="password" placeholder="New password">
    <button class="btn" onclick="forgotPassword()">Reset Password</button>
    <div class="error" id="forgot-error"></div>
    <div class="link" onclick="hideForgot()">← Back to login</div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="sidebar">
    <h2><span>Ride</span>SA</h2>
    <a onclick="showSection('dashboard')" class="active" id="nav-dashboard">Dashboard</a>
    <a onclick="showSection('rides')" id="nav-rides">Rides</a>
    <a onclick="showSection('clients')" id="nav-clients">Clients</a>
    <a onclick="showSection('drivers')" id="nav-drivers">Drivers</a>
    <a onclick="logout()" style="margin-top:40px;color:#f87171">Logout</a>
  </div>
  <div class="main">
    <div class="topbar">
      <h1 id="section-title">Dashboard</h1>
      <div class="user" id="user-info"></div>
    </div>

    <div class="section active" id="sec-dashboard">
      <div class="stats" id="stats"></div>
    </div>

    <div class="section" id="sec-rides">
      <table><thead><tr><th>ID</th><th>Client</th><th>Driver</th><th>Pickup</th><th>Dropoff</th><th>Status</th><th>Fare</th><th>Date</th><th></th></tr></thead>
      <tbody id="rides-table"></tbody></table>
    </div>

    <div class="section" id="sec-clients">
      <table><thead><tr><th>Name</th><th>Phone</th><th>Rides</th><th>Joined</th></tr></thead>
      <tbody id="clients-table"></tbody></table>
    </div>

    <div class="section" id="sec-drivers">
      <table><thead><tr><th>Name</th><th>Phone</th><th>Rides</th><th>Joined</th></tr></thead>
      <tbody id="drivers-table"></tbody></table>
    </div>
  </div>
</div>

<script>

let acTimer = {};
function autocomplete(inp, suggestId) {
  const wrap = inp.parentElement;
  wrap.style.position = 'relative';
  let div = document.getElementById(suggestId);
  if (!div) {
    div = document.createElement('div'); div.id = suggestId;
    div.className = 'suggestions'; wrap.appendChild(div);
  }
  clearTimeout(acTimer[suggestId]);
  acTimer[suggestId] = setTimeout(async () => {
    const q = inp.value.trim();
    if (q.length < 3) { div.style.display = 'none'; return; }
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=5&countrycodes=za');
      const d = await r.json();
      div.innerHTML = d.map(p => '<div onclick="pickSuggestion(\''+suggestId+'\',\''+p.display_name.replace(/'/g,"\\'")+'\')">'+p.display_name.split(',')[0]+'<br><small style=\"color:#607080\">'+p.display_name.split(',').slice(1).join(',').trim()+'</small></div>').join('');
      div.style.display = d.length ? 'block' : 'none';
    } catch(e) { div.style.display = 'none'; }
  }, 300);
}
function pickSuggestion(suggestId, val) {
  const div = document.getElementById(suggestId);
  if (div) div.style.display = 'none';
  const inp = div ? div.parentElement.querySelector('input') : null;
  if (inp) inp.value = val.split(',')[0].trim();
}

const API = window.location.origin + '/api';
let token = null;

async function login() {
  const login = document.getElementById('admin-id').value;
  const password = document.getElementById('admin-pass').value;
  try {
    let r = await fetch(API + '/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({login, password})
    });
    if (r.status === 401) {
      r = await fetch(API + '/auth/register', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name:'Marius', phone: login.includes('@')?'':login, email: login.includes('@')?login:'', password, role:'admin'})
      });
    }
    const d = await r.json();
    if (d.error) return document.getElementById('login-error').textContent = d.error;
    token = d.token;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-info').textContent = d.user.name + ' (Admin)';
    loadDashboard();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Server offline? ' + e.message;
  }
}

async function api(path) {
  const r = await fetch(API + path, {headers:{'Authorization':'Bearer '+token}});
  return r.json();
}

async function loadDashboard() {
  const users = await api('/admin/users');
  const rides = await api('/admin/rides');
  const clients = users.filter(u => u.role === 'client');
  const drivers = users.filter(u => u.role === 'driver');
  const completed = rides.filter(r => r.status === 'completed');
  const totalFare = completed.reduce((s,r) => s + (r.fare||0), 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">Total Rides</div><div class="value blue">${rides.length}</div></div>
    <div class="stat-card"><div class="label">Completed</div><div class="value green">${completed.length}</div></div>
    <div class="stat-card"><div class="label">Total Earnings</div><div class="value green">R${totalFare}</div></div>
    <div class="stat-card"><div class="label">Clients</div><div class="value blue">${clients.length}</div></div>
    <div class="stat-card"><div class="label">Drivers</div><div class="value orange">${drivers.length}</div></div>
    <div class="stat-card"><div class="label">1% to Charity</div><div class="value green">R${(totalFare * 0.01).toFixed(2)}</div></div>
  `;
  loadRides(rides);
  loadUsers(clients, drivers);
  // Panic alert — rides + carpool trips
  api('/carpool/admin/trips').then(trips => {
    const panicked = [
      ...rides.filter(r => r.status === 'panicked').map(r => r.id.slice(0,8)+' — '+r.pickup+' → '+r.dropoff+' (ride)'),
      ...trips.filter(t => t.status === 'panicked').map(t => t.id.slice(0,8)+' — '+t.pickup+' → '+t.dropoff+' (carpool)')
    ];
    const existing = document.getElementById('panic-alert');
    if (panicked.length) {
      if (!existing) {
        const div = document.createElement('div');
        div.id = 'panic-alert';
        div.style.cssText = 'background:#3a1a1a;border:2px solid #f87171;border-radius:10px;padding:16px;margin-bottom:20px';
        div.innerHTML = '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">🚨</span><div><div style="font-weight:700;color:#f87171;font-size:16px">EMERGENCY — '+panicked.length+' incident(s) need attention</div><div style="color:#e0b0b0;font-size:13px">'+panicked.join('<br>')+'</div></div></div>';
        document.getElementById('stats').after(div);
      }
    } else if (existing) existing.remove();
  });
}

function loadRides(rides) {
  document.getElementById('rides-table').innerHTML = rides.map(r => `
    <tr><td>${r.id.slice(0,8)}</td><td>${r.clientId.slice(0,8)}</td><td>${r.driverId ? r.driverId.slice(0,8) : '—'}</td>
    <td>${r.pickup}</td><td>${r.dropoff}</td>
    <td><span class="status ${r.status}">${r.status}</span></td>
    <td>${r.fare ? 'R'+r.fare : '—'}</td>
    <td>${new Date(r.created).toLocaleDateString('en-ZA')}</td>
    <td>${r.status === 'requested' ? '<button class="btn" onclick="acceptRide(\''+r.id+'\')">Accept</button>' : ''}</td></tr>
  `).join('');
}

async function acceptRide(id) {
  try {
    const r = await fetch(API+'/rides/'+id+'/accept', {method:'PUT', headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    if (d.error) return alert(d.error);
    loadDashboard();
  } catch(e) { alert('Failed: '+e.message); }
}

function loadUsers(clients, drivers) {
  document.getElementById('clients-table').innerHTML = clients.map(u => `
    <tr><td>${u.name}</td><td>${u.phone}</td><td>—</td><td>${new Date(u.created).toLocaleDateString('en-ZA')}</td></tr>
  `).join('');
  document.getElementById('drivers-table').innerHTML = drivers.map(u => `
    <tr><td>${u.name}</td><td>${u.phone}</td><td>—</td><td>${new Date(u.created).toLocaleDateString('en-ZA')}</td></tr>
  `).join('');
}

function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  const titles = {dashboard:'Dashboard',rides:'All Rides',clients:'Clients',drivers:'Drivers'};
  document.getElementById('section-title').textContent = titles[name] || name;
  if (name === 'dashboard') loadDashboard();
  if (name === 'rides') api('/admin/rides').then(loadRides);
}

function logout() {
  token = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showForgot() {
  document.querySelectorAll('#login-screen input, #login-screen .error, #login-screen h1, #login-screen p, #login-screen .btn').forEach(e => e.style.display = 'none');
  document.getElementById('forgot-form').style.display = 'block';
}
function hideForgot() {
  document.querySelectorAll('#login-screen input, #login-screen .error, #login-screen h1, #login-screen p, #login-screen .btn').forEach(e => e.style.display = '');
  document.getElementById('forgot-form').style.display = 'none';
}
async function forgotPassword() {
  const login = document.getElementById('forgot-id').value;
  const password = document.getElementById('forgot-pass').value;
  document.getElementById('forgot-error').textContent = '';
  try {
    const r = await fetch(API+'/auth/forgot', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({login, password})});
    const d = await r.json();
    if (d.error) return document.getElementById('forgot-error').textContent = d.error;
    alert('Password updated! Sign in with your new password.');
    hideForgot();
  } catch(e) { document.getElementById('forgot-error').textContent = 'Server error: '+e.message; }
}
</script>
</body>
</html>
